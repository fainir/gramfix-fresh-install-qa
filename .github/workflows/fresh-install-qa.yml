name: Fresh install QA

# Installs the PUBLISHED installer on a clean macOS runner (no Keychain key, no
# preferences, nothing configured), corrects a sentence in TextEdit with the
# real global shortcut and reads the text back. Uses at most one
# included request from the capped shared allowance per run.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Published version to install
        default: '1.0.4'
      runner:
        description: macOS runner label (Apple Silicon)
        default: 'macos-14'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  fresh-install:
    runs-on: ${{ inputs.runner || 'macos-14' }}
    timeout-minutes: 20
    env:
      VERSION: ${{ inputs.version || '1.0.4' }}
    steps:
      - name: Download the published installer and check it against release.json
        run: |
          set -euo pipefail
          curl -fsS https://gramfix.app/release.json | tee release.json
          python3 -c "import json,os; r=json.load(open('release.json')); assert r['version']==os.environ['VERSION'], r"
          SHA=$(python3 -c "import json; print(json.load(open('release.json'))['sha256'])")
          URL=$(python3 -c "import json; print(json.load(open('release.json'))['download_url'])")
          curl -fsS -o Gramfix.dmg "$URL"
          echo "$SHA  Gramfix.dmg" | shasum -a 256 -c -
          hdiutil attach -nobrowse -readonly -mountpoint /tmp/gramfix-dmg Gramfix.dmg
          ditto /tmp/gramfix-dmg/Gramfix.app /Applications/Gramfix.app
          hdiutil detach /tmp/gramfix-dmg
          /usr/sbin/spctl --assess --type execute -vv /Applications/Gramfix.app
          defaults read /Applications/Gramfix.app/Contents/Info CFBundleShortVersionString
          defaults read /Applications/Gramfix.app/Contents/Info CFBundleVersion

      - name: Confirm this Mac is fresh (no saved key, no preferences)
        run: |
          if security find-generic-password -s com.gramfix.app.openai -a api-key >/dev/null 2>&1; then echo 'A key exists'; exit 1; fi
          test ! -e "$HOME/Library/Application Support/Gramfix/gramfix_config.json"
          echo 'No Gramfix key in Keychain and no preferences file.'

      - name: Grant Accessibility and Input Monitoring on the runner
        run: |
          set -euo pipefail
          codesign -d -r- /Applications/Gramfix.app 2>&1 | sed -n 's/^designated => //p' > req.txt
          csreq -r req.txt -b req.bin
          HEX=$(xxd -p req.bin | tr -d '\n')
          for DB in "/Library/Application Support/com.apple.TCC/TCC.db" "$HOME/Library/Application Support/com.apple.TCC/TCC.db"; do
            for SERVICE in kTCCServiceAccessibility kTCCServiceListenEvent; do
              sudo sqlite3 "$DB" "INSERT OR REPLACE INTO access (service, client, client_type, auth_value, auth_reason, auth_version, csreq, indirect_object_identifier, flags, last_modified) VALUES ('$SERVICE','com.gramfix.app',0,2,3,1,X'$HEX','UNUSED',0,CAST(strftime('%s','now') AS INTEGER));" || echo "skip $SERVICE in $DB"
            done
          done
          sudo killall -9 tccd || true

      - name: Launch Gramfix and correct a sentence in TextEdit with Cmd+E
        run: |
          set -euo pipefail
          cat > key.swift <<'SWIFT'
          import CoreGraphics
          import Foundation
          // Like a physical keyboard: Command down, key down/up with the Command flag, Command up.
          let code = CGKeyCode(Int(CommandLine.arguments[1])!)
          let command = CGKeyCode(55)
          let source = CGEventSource(stateID: .hidSystemState)
          func post(_ key: CGKeyCode, _ down: Bool, _ flags: CGEventFlags) {
              let event = CGEvent(keyboardEventSource: source, virtualKey: key, keyDown: down)!
              event.flags = flags
              event.post(tap: .cghidEventTap)
              usleep(60_000)
          }
          post(command, true, .maskCommand)
          post(code, true, .maskCommand)
          post(code, false, .maskCommand)
          post(command, false, [])
          SWIFT
          swiftc -O key.swift -o key
          # Same poster as a tiny app, so it is its own responsible process for TCC.
          mkdir -p KeyPoster.app/Contents/MacOS
          cp key KeyPoster.app/Contents/MacOS/KeyPoster
          /usr/libexec/PlistBuddy -c 'Add :CFBundleIdentifier string com.gramfix.qa.keyposter' -c 'Add :CFBundleExecutable string KeyPoster' -c 'Add :LSUIElement bool true' KeyPoster.app/Contents/Info.plist
          codesign -s - --force KeyPoster.app
          codesign -d -r- KeyPoster.app 2>&1 | sed -n 's/^#* *designated => //p' > kreq.txt; cat kreq.txt
          csreq -r kreq.txt -b kreq.bin
          KHEX=$(xxd -p kreq.bin | tr -d '\n')
          for DB in "/Library/Application Support/com.apple.TCC/TCC.db" "$HOME/Library/Application Support/com.apple.TCC/TCC.db"; do
            for SERVICE in kTCCServiceAccessibility kTCCServicePostEvent; do
              sudo sqlite3 "$DB" "INSERT OR REPLACE INTO access (service, client, client_type, auth_value, auth_reason, auth_version, csreq, indirect_object_identifier, flags, last_modified) VALUES ('$SERVICE','com.gramfix.qa.keyposter',0,2,3,1,X'$KHEX','UNUSED',0,CAST(strftime('%s','now') AS INTEGER));" || echo "skip $SERVICE in $DB"
            done
          done
          sudo killall -9 tccd || true
          press() { ./key "$1"; }
          press_app() { open -W -g -a "$PWD/KeyPoster.app" --args "$1"; }
          sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" "select service, client, auth_value from access where client like '%gramfix%'" || true
          open /Applications/Gramfix.app
          sleep 12
          pgrep -fl Gramfix.app
          screencapture -x 1-launched.png || true
          # No AppleScript (the runner may not send Apple Events): open a plain-text file, correct, save, read the file.
          SAMPLE="$RUNNER_TEMP/sample.txt"
          printf 'this are a example sentence with bad grammer.' > "$SAMPLE"
          open -a TextEdit "$SAMPLE"
          sleep 5
          screencapture -x 2-textedit.png || true
          attempt() {
            POST=$1
            $POST 0; sleep 1    # Cmd+A
            echo -n '' | pbcopy; $POST 8; sleep 1    # Cmd+C proves the keystrokes reach TextEdit
            echo "[$POST] clipboard after Cmd+A, Cmd+C: $(pbpaste)"
            $POST 14   # Cmd+E, the default Gramfix correction shortcut
            for i in $(seq 1 12); do
              sleep 2
              $POST 1  # Cmd+S saves the file in place
              sleep 1
              TEXT=$(cat "$SAMPLE")
              if [ "$TEXT" != "this are a example sentence with bad grammer." ]; then return 0; fi
            done
            return 1
          }
          TEXT=""
          attempt press || { screencapture -x 3a-cli-attempt.png || true; attempt press_app || true; }
          screencapture -x 3-after-correction.png || true
          echo "TextEdit now reads: $TEXT"
          echo "$TEXT" > result.txt
          python3 - <<'PY'
          t = open('result.txt').read().strip()
          assert t != 'this are a example sentence with bad grammer.', 'Text was not corrected'
          assert 'grammar' in t and 'is' in t.lower(), t
          print('PASS: fresh install corrected text with no key saved')
          PY

      - name: Collect evidence
        if: always()
        run: |
          cp "$HOME/Library/Logs/gramfix.log" . 2>/dev/null || echo 'no error log' > gramfix.log
          python3 -c "import json,os;d=json.load(open(os.path.expanduser('~/Library/Application Support/Gramfix/gramfix_config.json')));print({k:d[k] for k in d if k!='shortcuts'})" || true
          security find-generic-password -s com.gramfix.app.openai -a api-key >/dev/null 2>&1 && echo 'key present' || echo 'still no key saved'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fresh-install-evidence
          path: |
            *.png
            result.txt
            release.json
            gramfix.log
